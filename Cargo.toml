[package]
name = "IPAPS"
version = "0.3.1"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

reqwest = { version = "0.13.4", features = ["blocking", "json"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1.12"
